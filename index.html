<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sites Preferidos Helenio</title>
    <link rel="icon" href="https://i.ibb.co/p6j8M5Yh/icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F5E7B2;
            --gold-dark: #B8960C;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-main: #0f0f1a;
            --bg-card: rgba(30, 30, 50, 0.85);
            --bg-card-hover: rgba(40, 40, 65, 0.95);
            --bg-input: rgba(255, 255, 255, 0.05);
            --success: #2ecc71;
            --success-hover: #27ae60;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --primary: #7b8fa1;
            --border: rgba(212, 175, 55, 0.25);
            --text-main: #e8e6e3;
            --text-muted: #a0a0b0;
            --text-dim: #6b6b7b;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* DESTAQUE ESPECIAL PARA TV TCL */
        .focusable:focus, .focused {
            outline: 5px solid var(--gold) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 25px var(--gold-glow), inset 0 0 10px rgba(212,175,55,0.1) !important;
            transform: scale(1.03) !important;
            transition: all 0.1s ease !important;
            z-index: 99 !important;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute; width: 4px; height: 4px;
            background: var(--gold); border-radius: 50%;
            opacity: 0.3; animation: float 15s infinite ease-in-out;
        }
        @keyframes float {
            0%,100% { transform: translateY(100vh) rotate(0deg); opacity:0; }
            10% { opacity:0.3; } 90% { opacity:0.3; }
            50% { transform: translateY(-10vh) rotate(180deg); }
        }

        .header { text-align: center; margin-bottom:24px; position:relative; z-index:1; }
        .profile-wrapper { display:inline-block; margin-bottom:12px; position:relative; }
        .profile-img {
            width:90px; height:90px; border-radius:50%; object-fit:cover;
            border:3px solid var(--gold); box-shadow:0 0 30px rgba(212,175,55,0.3);
        }
        .profile-ring {
            position:absolute; top:-6px; left:-6px; width:102px; height:102px;
            border:2px solid transparent; border-top-color:var(--gold);
            border-radius:50%; animation: spin 8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h1 { font-family:'Great Vibes', cursive; color:var(--gold); font-size:2.2rem; text-shadow:0 2px 10px rgba(212,175,55,0.3); }
        .subtitle { color:var(--text-muted); font-size:0.85rem; margin-top:2px; }

        .container { width:100%; max-width:680px; margin:0 auto; position:relative; z-index:1; }

        .form-card {
            background:var(--bg-card); border-radius:var(--radius); padding:20px; margin-bottom:20px;
            border:1px solid var(--border); box-shadow:var(--shadow);
        }
        .form-title { font-size:0.9rem; color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:8px; font-weight:600; }
        .input-group { display:flex; gap:10px; flex-wrap:wrap; }
        .input-wrapper { flex:1; min-width:140px; position:relative; }
        .input-wrapper i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); }
        .input-group input {
            width:100%; padding:14px 14px 14px 38px; border:1px solid var(--border);
            border-radius:var(--radius-sm); font-size:1rem; background:var(--bg-input);
            color:var(--text-main); min-height:52px;
        }
        .btn-primary {
            padding:14px 28px; border-radius:var(--radius-sm); font-size:1rem; border:none;
            background:linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color:#0f0f1a; font-weight:600; min-height:52px; min-width:110px;
            display:flex; align-items:center; gap:6px;
        }

        .links-container {
            background:var(--bg-card); border-radius:var(--radius); padding:16px; margin-bottom:20px;
            border:1px solid var(--border); box-shadow:var(--shadow);
        }
        .links-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
        .links-title { font-size:0.9rem; color:var(--gold); font-weight:600; display:flex; align-items:center; gap:8px; }
        .links-list { list-style:none; max-height:50vh; overflow-y:auto; padding-right:4px; }
        .link-item {
            display:flex; align-items:center; gap:12px; padding:16px; border-radius:var(--radius-sm);
            margin-bottom:8px; border:1px solid transparent; min-height:60px;
            transition:all 0.1s ease; cursor:pointer;
        }
        .link-favicon { width:42px; height:42px; border-radius:10px; background:rgba(212,175,55,0.1); display:flex; align-items:center; justify-content:center; }
        .link-favicon i { color:var(--gold); font-size:1.1rem; }
        .link-name { color:var(--text-main); font-size:1rem; font-weight:500; }
        .link-url { color:var(--text-dim); font-size:0.8rem; margin-top:2px; }
        .link-actions { display:flex; gap:6px; }
        .btn-icon { width:42px; height:42px; border-radius:8px; border:none; background:transparent; color:var(--text-muted); font-size:1.1rem; cursor:pointer; }
        .btn-icon:hover, .btn-icon:focus { background:rgba(255,255,255,0.1); color:var(--gold); }
        .btn-icon.delete:hover, .btn-icon.delete:focus { background:rgba(231,76,60,0.15); color:var(--danger); }

        .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); }
        .empty-state i { font-size:3rem; color:var(--border); margin-bottom:15px; }

        .backup-card { background:var(--bg-card); border-radius:var(--radius); padding:20px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .backup-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .backup-title { font-size:0.9rem; color:var(--gold); font-weight:600; display:flex; align-items:center; gap:8px; }
        .backup-status { font-size:0.8rem; padding:5px 12px; border-radius:20px; background:rgba(46,204,113,0.1); color:var(--success); }
        .backup-input-group { position:relative; margin-bottom:12px; }
        .backup-input-group textarea {
            width:100%; height:65px; padding:14px 50px 14px 14px; border:1px solid var(--border);
            border-radius:var(--radius-sm); background:var(--bg-input); color:var(--text-main); font-size:0.9rem;
        }
        .backup-input-group .copy-btn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:8px; border:none; background:rgba(255,255,255,0.08); color:var(--text-muted); font-size:1rem; cursor:pointer; }
        .backup-buttons { display:flex; gap:10px; flex-wrap:wrap; }
        .btn-action { padding:12px 18px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-input); color:var(--text-muted); font-size:0.9rem; min-height:48px; cursor:pointer; display:flex; align-items:center; gap:6px; }
        .btn-action.primary { background:linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color:#000; border:none; font-weight:600; }
        .btn-action:hover, .btn-action:focus { border-color:var(--gold); color:var(--gold); background:rgba(212,175,55,0.08); }

        .toast-container { position:fixed; top:20px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
        .toast { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 20px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); animation:slideIn 0.3s ease; max-width:350px; }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        .toast i { font-size:1.2rem; }
        .toast.success i { color:var(--success); }
        .toast.error i { color:var(--danger); }

        .modal-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8);
            display:flex; align-items:center; justify-content:center; z-index:999;
            opacity:0; visibility:hidden; transition:all 0.3s ease;
        }
        .modal-overlay.active { opacity:1; visibility:visible; }
        .modal { background:var(--bg-card); border-radius:var(--radius); padding:28px; width:90%; max-width:400px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .modal-title { font-size:1.3rem; color:var(--text-main); margin-bottom:10px; font-weight:600; }
        .modal-text { font-size:1rem; color:var(--text-muted); margin-bottom:24px; line-height:1.5; }
        .modal-buttons { display:flex; gap:15px; justify-content:flex-end; }

        .footer { text-align:center; margin-top:24px; padding:16px; color:var(--text-dim); font-size:0.8rem; }
        .footer i { color:var(--danger); }

        @media (max-width:480px) {
            h1 { font-size:1.7rem; }
            .input-group { flex-direction:column; }
            .input-wrapper { width:100%; }
            .btn-primary { width:100%; justify-content:center; }
            .link-actions { opacity:1; }
            .backup-buttons { justify-content:center; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-title" id="modalTitle">Confirmar</div>
            <div class="modal-text" id="modalText">Tem certeza?</div>
            <div class="modal-buttons">
                <button class="btn-action focusable" id="modalCancelBtn" onclick="closeModal()">Cancelar</button>
                <button class="btn-action danger focusable" id="modalConfirmBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="profile-wrapper focusable" tabindex="-1">
            <div class="profile-ring"></div>
            <img src="https://i.ibb.co/n8Dvmqbr/photo-1738003366938-d5af91b55f36.jpg" alt="Helenio" class="profile-img">
        </div>
        <h1>Sites Preferidos Helenio</h1>
        <p class="subtitle">Seus links favoritos sempre à mão</p>
    </header>

    <main class="container">
        <div class="form-card">
            <div class="form-title"><i class="fas fa-plus-circle"></i> <span id="formTitleText">Adicionar Novo Link</span></div>
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="siteName" class="focusable" placeholder="Nome do site" onkeypress="handleEnter(event)">
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-link"></i>
                    <input type="text" id="siteUrl" class="focusable" placeholder="Endereço do site" onkeypress="handleEnter(event)">
                </div>
                <button onclick="saveLink()" class="btn-primary focusable" id="saveBtn">
                    <i class="fas fa-save"></i> <span id="saveBtnText">Salvar</span>
                </button>
                <button onclick="cancelEdit()" class="btn-action focusable" id="cancelBtn" style="display:none;">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>

        <div class="links-container">
            <div class="links-header">
                <div class="links-title"><i class="fas fa-bookmark"></i> Meus Links</div>
            </div>
            <ul id="linksList" class="links-list"></ul>
        </div>

        <div class="backup-card">
            <div class="backup-header">
                <div class="backup-title"><i class="fas fa-cloud"></i> Backup e Restauração</div>
                <span class="backup-status" id="backupStatus"><i class="fas fa-check-circle"></i> Pronto</span>
            </div>
            <div class="backup-input-group">
                <textarea id="backupCode" class="focusable" placeholder="Código de backup ou ID da nuvem"></textarea>
                <button class="copy-btn focusable" onclick="copyBackupCode()" title="Copiar"><i class="fas fa-copy"></i></button>
            </div>
            <div class="backup-buttons">
                <button class="btn-action focusable" onclick="generateBackup()"><i class="fas fa-download"></i> Gerar Local</button>
                <button class="btn-action focusable" onclick="restoreBackup()"><i class="fas fa-upload"></i> Restaurar Local</button>
                <button class="btn-action primary focusable" onclick="uploadToCloud()"><i class="fas fa-cloud-upload-alt"></i> Enviar Nuvem</button>
                <button class="btn-action primary focusable" onclick="downloadFromCloud()"><i class="fas fa-cloud-download-alt"></i> Baixar Nuvem</button>
            </div>
        </div>
    </main>

    <footer class="footer">Feito com <i class="fas fa-heart"></i> para Helenio</footer>

    <script>
        let links = JSON.parse(localStorage.getItem('helenio_links')) || [];
        let editIndex = -1;
        const apiKey = "$2a$10$G4lyy9OHvSKE5WxTrKa5b.KjJR7MoSJOFXDDQYqRxfjgLOB4/BExe";
        const accessKey = "$2a$10$GH2GVM6At0oiDgHxdXyS4.v8BHoCW1HaSMcGz9PpzMxTW.WabnekK";
        const binStorageKey = "helenio_jsonbin_id";

        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            atualizarTudo();
            const id = localStorage.getItem(binStorageKey);
            if(id && /^[a-f0-9]{24}$/i.test(id)) document.getElementById('backupCode').value = id;
            
            initTCLRemote();
            setTimeout(() => document.getElementById('siteName').focus(), 500);
        });

        function createParticles() {
            const c = document.getElementById('particles');
            for(let i=0;i<20;i++){
                const p = document.createElement('div'); p.className='particle';
                p.style.left = Math.random()*100+'%'; p.style.animationDelay = Math.random()*15+'s';
                c.appendChild(p);
            }
        }

        function showToast(msg, tipo='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div'); t.className=`toast ${tipo}`;
            const ic = {success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle'};
            t.innerHTML = `<i class="fas ${ic[tipo]}"></i> <span>${msg}</span>`;
            c.appendChild(t); setTimeout(()=>t.remove(),3000);
        }

        let modalOk = null;
        function showModal(tit, txt, btnTxt, fn) {
            document.getElementById('modalTitle').textContent=tit;
            document.getElementById('modalText').textContent=txt;
            document.getElementById('modalConfirmBtn').textContent=btnTxt;
            modalOk=fn; document.getElementById('confirmModal').classList.add('active');
            setTimeout(()=>document.getElementById('modalCancelBtn').focus(),150);
        }
        function closeModal() { document.getElementById('confirmModal').classList.remove('active'); modalOk=null; }
        document.getElementById('modalConfirmBtn').onclick=()=>{if(modalOk)modalOk();closeModal();};
        document.getElementById('modalCancelBtn').onclick=closeModal;

        function urlValida(u){u=u.trim();if(!u)return null;if(!u.startsWith('http'))u='https://'+u;return/^https?:\/\/.+\..+/.test(u)?u:null;}
        function getDominio(u){try{return new URL(u).hostname.replace('www.','')}catch{return u}}
        function ordena(){links.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}))}

        function render(){
            const l=document.getElementById('linksList');
            if(!links.length){l.innerHTML=`<div class="empty-state"><i class="fas fa-bookmark"></i><p>Nenhum link salvo ainda</p></div>`;return;}
            l.innerHTML='';
            links.forEach((ln,i)=>{
                const fav = `https://www.google.com/s2/favicons?domain=${getDominio(ln.url)}&sz=48`;
                const li = document.createElement('li');
                li.className='link-item focusable'; li.tabIndex=0;
                li.innerHTML=`
                    <div class="link-favicon"><img src="${fav}" alt="" onerror="this.parentElement.innerHTML='<i class=\'fas fa-globe\'></i>'"></div>
                    <div class="link-info"><div class="link-name">${ln.name}</div><div class="link-url">${getDominio(ln.url)}</div></div>
                    <div class="link-actions">
                        <button class="btn-icon focusable" onclick="event.stopPropagation();editarLink(${i})"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon delete focusable" onclick="event.stopPropagation();confirmaExcluir(${i})"><i class="fas fa-trash"></i></button>
                    </div>`;
                li.onclick=()=>window.open(ln.url,'_blank');
                li.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' ')window.open(ln.url,'_blank')};
                l.appendChild(li);
            });
        }

        function salva(){
            const n=document.getElementById('siteName').value.trim();
            const u=urlValida(document.getElementById('siteUrl').value);
            if(!n||!u)return showToast('Preencha tudo corretamente!','error');
            if(links.some(x=>x.url===u&&links.indexOf(x)!==editIndex))return showToast('Link já existe!','error');
            if(editIndex===-1){links.push({name:n,url:u,data:Date.now()});showToast('Adicionado!');}
            else{links[editIndex]={name:n,url:u,data:Date.now()};showToast('Atualizado!');}
            editIndex=-1; limpaForm(); atualizarTudo();
        }
        function editarLink(i){document.getElementById('siteName').value=links[i].name;document.getElementById('siteUrl').value=links[i].url;editIndex=i;document.getElementById('formTitleText').textContent='Editar';document.getElementById('saveBtnText').textContent='Atualizar';document.getElementById('cancelBtn').style.display='flex';}
        function limpaForm(){document.getElementById('siteName').value='';document.getElementById('siteUrl').value='';document.getElementById('formTitleText').textContent='Adicionar Novo Link';document.getElementById('saveBtnText').textContent='Salvar';document.getElementById('cancelBtn').style.display='none';}
        function confirmaExcluir(i){showModal('Excluir',`Excluir "${links[i].name}"?`,'Excluir',()=>{links.splice(i,1);atualizarTudo();showToast('Excluído!')})}
        function atualizarTudo(){ordena();localStorage.setItem('helenio_links',JSON.stringify(links));render();}
        function handleEnter(e){if(e.key==='Enter')salva()}

        function gerarBackup(){if(!links.length)return showToast('Nada para exportar','info');document.getElementById('backupCode').value=btoa(JSON.stringify(links));showToast('Código gerado!')}
        function restaurar(){const c=document.getElementById('backupCode').value.trim();if(!c)return showToast('Cole o código!','error');try{const d=JSON.parse(atob(c));if(!Array.isArray(d))throw'';showModal('Restaurar',`Importar ${d.length} links?`,'Sim',()=>{links=d;atualizarTudo();showToast('Pronto!')})}catch{showToast('Código inválido!','error')}}
        function copiar(){const t=document.getElementById('backupCode');if(!t.value)return;t.select();document.execCommand('copy');showToast('Copiado!')}

        async function enviarNuvem(){
            const st=document.getElementById('backupStatus');st.innerHTML='<i class="fas fa-spinner fa-spin"></i> Enviando...';
            let id=document.getElementById('backupCode').value.trim()||localStorage.getItem(binStorageKey)||'';
            let url='https://api.jsonbin.io/v3/b',metodo='POST',h={"Content-Type":"application/json","X-Master-Key":apiKey,"X-Access-Key":accessKey};
            if(/^[a-f0-9]{24}$/i.test(id)){url+=`/${id}`;metodo='PUT'}else{h['X-Bin-Name']='helenio_links_backup';h['X-Bin-Private']='true'}
            try{const r=await fetch(url,{method:metodo,headers:h,body:JSON.stringify(links)});const d=await r.json();if(r.ok){id=metodo==='POST'?d.metadata.id:id;localStorage.setItem(binStorageKey,id);document.getElementById('backupCode').value=id;st.innerHTML='<i class="fas fa-check-circle"></i> Sincronizado';showToast('Salvo na nuvem!')}else{st.innerHTML='<i class="fas fa-times-circle"></i> Erro';showToast('Erro: '+(d.message||'Falha'),'error')}}catch{st.innerHTML='<i class="fas fa-times-circle"></i> Offline';showToast('Sem conexão','error')}
        }
        async function buscarNuvem(){
            const st=document.getElementById('backupStatus');st.innerHTML='<i class="fas fa-spinner fa-spin"></i> Baixando...';
            const id=(document.getElementById('backupCode').value.trim()||localStorage.getItem(binStorageKey)||'');
            if(!/^[a-f0-9]{24}$/i.test(id))return st.innerHTML='<i class="fas fa-exclamation-circle"></i> Inválido',showToast('ID incorreto!','error');
            try{const r=await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`,{headers:{"X-Master-Key":apiKey,"X-Access-Key":accessKey}});const d=await r.json();if(r.ok&&Array.isArray(d.record)){links=d.record;atualizarTudo();localStorage.setItem(binStorageKey,id);st.innerHTML='<i class="fas fa-check-circle"></i> Pronto';showToast('Baixado!')}else st.innerHTML='<i class="fas fa-times-circle"></i> Erro',showToast('Dados inválidos','error')}catch{st.innerHTML='<i class="fas fa-times-circle"></i> Offline';showToast('Sem conexão','error')}
        }

        /* === SUPORTE EXCLUSIVO PARA CONTROLE TCL === */
        function initTCLRemote(){
            const teclas = {
                VOLTAR:['Escape','Back','BrowserBack',27,10009],
                OK:['Enter',' ',13,32],
                CIMA:['ArrowUp',38], BAIXO:['ArrowDown',40],
                ESQ:['ArrowLeft',37], DIR:['ArrowRight',39]
            };

            document.addEventListener('keydown', e=>{
                const k = e.key, c = e.keyCode;
                const modalAberto = document.getElementById('confirmModal').classList.contains('active');

                // TECLA VOLTAR
                if(teclas.VOLTAR.includes(k)||teclas.VOLTAR.includes(c)){
                    e.preventDefault();
                    if(modalAberto) return closeModal();
                    document.getElementById('siteName').focus();
                    return;
                }

                // TECLA OK / CONFIRMAR
                if(teclas.OK.includes(k)||teclas.OK.includes(c)){
                    e.preventDefault();
                    if(modalAberto) return document.getElementById('modalConfirmBtn').click();
                    if(document.activeElement.classList.contains('focusable')) document.activeElement.click();
                    return;
                }

                // NAVEGAÇÃO POR SETAS
                const todos = Array.from(document.querySelectorAll('.focusable')).filter(el=>el.offsetParent!==null);
                const atual = todos.indexOf(document.activeElement);
                if(atual===-1) return;

                if(teclas.BAIXO.includes(k)||teclas.BAIXO.includes(c)){
                    e.preventDefault(); const prox = (atual+1)%todos.length; todos[prox].focus();
                }
                if(teclas.CIMA.includes(k)||teclas.CIMA.includes(c)){
                    e.preventDefault(); const ant = (atual-1+todos.length)%todos.length; todos[ant].focus();
                }

                // MANTER ITEM VISÍVEL NA TELA
                setTimeout(()=>{
                    if(document.activeElement&&document.activeElement!==document.body)
                        document.activeElement.scrollIntoView({block:'center',behavior:'smooth'});
                },30);
            });
        }
    </script>
</body>
</html>
